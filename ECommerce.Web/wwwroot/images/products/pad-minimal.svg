<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="100%" stop-color="#080a14" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- Perspective Desk Mat -->
  <g transform="translate(60, 180)">
    <polygon points="40,0 440,0 480,240 0,240" fill="#0d111d" stroke="url(#neonCyan)" stroke-width="3" filter="url(#glow)"/>
    <!-- Circuit lines across mat -->
    <g stroke="url(#neonCyan)" stroke-width="2" opacity="0.85" filter="url(#glow)">
      <line x1="80" y1="40" x2="160" y2="40"/>
      <line x1="160" y1="40" x2="200" y2="90"/>
      <line x1="200" y1="90" x2="320" y2="90"/>
      <circle cx="320" cy="90" r="4" fill="#06b6d4"/>
      
      <line x1="100" y1="180" x2="240" y2="180"/>
      <line x1="240" y1="180" x2="290" y2="130"/>
      <line x1="290" y1="130" x2="400" y2="130"/>
      <circle cx="400" cy="130" r="4" fill="#3b82f6"/>
    </g>
    <!-- Branding on mat -->
    <text x="240" y="210" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">NEXUS // XXL GAMING MAT</text>
  </g>
</svg>
