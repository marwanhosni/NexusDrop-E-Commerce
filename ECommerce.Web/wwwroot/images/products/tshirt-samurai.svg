<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1838" />
      <stop offset="100%" stop-color="#090a10" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Cyber grid backdrop -->
  <g stroke="rgba(139, 92, 246, 0.12)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="600" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
    <line x1="550" y1="0" x2="550" y2="600" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
  </g>

  <!-- Glowing pedestal -->
  <ellipse cx="300" cy="510" rx="180" ry="24" fill="none" stroke="url(#neonPurple)" stroke-width="2" filter="url(#glow)"/>
  <ellipse cx="300" cy="510" rx="140" ry="16" fill="rgba(168, 85, 247, 0.15)" />

  <!-- T-Shirt Silhouette -->
  <path d="M 230,120 Q 300,165 370,120 L 460,180 L 415,260 L 375,235 L 375,470 L 225,470 L 225,235 L 185,260 L 140,180 Z" 
        fill="#12131c" stroke="#25293d" stroke-width="3" />

  <!-- Collar detail -->
  <path d="M 230,120 Q 300,165 370,120 Q 300,140 230,120 Z" fill="#1b1e2e" stroke="url(#neonCyan)" stroke-width="1.5"/>

  <!-- Chest Graphic: Neon Cyber Samurai Crest -->
  <g transform="translate(300, 290)" filter="url(#glow)">
    <!-- Samurai Helmet / Oni Mask Stylized Geometry -->
    <polygon points="0,-70 45,-30 35,25 0,55 -35,25 -45,-30" fill="none" stroke="url(#neonPurple)" stroke-width="3"/>
    <polygon points="0,-50 30,-20 25,18 0,40 -25,18 -30,-20" fill="rgba(168, 85, 247, 0.2)" stroke="url(#neonCyan)" stroke-width="2"/>
    <!-- Horns / Crest -->
    <path d="M -25,-60 L -60,-100 L -40,-60 L -20,-50" fill="url(#neonCyan)"/>
    <path d="M 25,-60 L 60,-100 L 40,-60 L 20,-50" fill="url(#neonCyan)"/>
    <!-- Visor slits -->
    <line x1="-20" y1="-5" x2="-5" y2="-5" stroke="#ffffff" stroke-width="3"/>
    <line x1="5" y1="-5" x2="20" y2="-5" stroke="#ffffff" stroke-width="3"/>
    <!-- Japanese Kanji / Sci-Fi Glyph for Samurai -->
    <text x="0" y="80" text-anchor="middle" font-family="'Orbitron', monospace" font-size="14" font-weight="900" fill="#06b6d4" letter-spacing="4">
      侍 // NEOSAMURAI
    </text>
  </g>

  <!-- Spec Tag -->
  <rect x="345" y="445" width="22" height="12" fill="#a855f7" rx="2"/>
  <text x="356" y="454" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">280G</text>
</svg>

