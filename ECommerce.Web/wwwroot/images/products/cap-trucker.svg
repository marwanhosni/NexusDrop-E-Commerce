<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#192038" />
      <stop offset="100%" stop-color="#070912" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="480" rx="160" ry="20" fill="none" stroke="url(#neonCyan)" stroke-width="2" filter="url(#glow)"/>
  <!-- Foam Front Panel -->
  <path d="M 190,340 C 190,200 410,200 410,340 Z" fill="#151928" stroke="#2b324d" stroke-width="3"/>
  <!-- Curved Visor -->
  <path d="M 160,340 Q 300,310 440,340 L 480,390 Q 300,360 120,390 Z" fill="#1b2034" stroke="url(#neonCyan)" stroke-width="2" filter="url(#glow)"/>
  <!-- Holographic Front Crest -->
  <polygon points="300,230 350,265 330,315 270,315 250,265" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" filter="url(#glow)"/>
  <text x="300" y="285" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">ND</text>
  <text x="300" y="440" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="url(#neonCyan)" text-anchor="middle" letter-spacing="4">REFLECTIVE TRUCKER</text>
</svg>
