<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#122533" />
      <stop offset="100%" stop-color="#080c12" />
    </radialGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Pedestal -->
  <ellipse cx="290" cy="490" rx="160" ry="22" fill="none" stroke="url(#cyanNeon)" stroke-width="2" filter="url(#glow)"/>
  <ellipse cx="290" cy="490" rx="120" ry="14" fill="rgba(0, 242, 254, 0.15)"/>

  <!-- Mug Handle -->
  <path d="M 380,240 C 470,240 470,400 380,400" fill="none" stroke="#1a2233" stroke-width="26" stroke-linecap="round"/>
  <path d="M 380,240 C 470,240 470,400 380,400" fill="none" stroke="url(#cyanNeon)" stroke-width="3" filter="url(#glow)"/>

  <!-- Mug Body -->
  <path d="M 190,200 L 205,450 Q 290,470 375,450 L 390,200 Z" fill="#101520" stroke="#25324a" stroke-width="3"/>

  <!-- Mug Rim -->
  <ellipse cx="290" cy="200" rx="100" ry="24" fill="#182030" stroke="url(#cyanNeon)" stroke-width="2"/>
  <ellipse cx="290" cy="200" rx="88" ry="18" fill="#0c1018" stroke="#00f2fe" stroke-width="1"/>

  <!-- Rising Steam Vapor (Cyber Holographic) -->
  <path d="M 260,165 Q 240,120 270,80 Q 290,50 280,30" fill="none" stroke="url(#cyanNeon)" stroke-width="3" opacity="0.7" filter="url(#glow)"/>
  <path d="M 310,160 Q 340,115 315,75 Q 300,45 320,25" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.6" filter="url(#glow)"/>

  <!-- Heat-Reactive Matrix Circuit on Mug -->
  <g transform="translate(290, 335)" filter="url(#glow)">
    <!-- Glowing digital stream lines -->
    <rect x="-70" y="-80" width="140" height="150" fill="rgba(0, 242, 254, 0.05)" rx="4"/>
    <line x1="-50" y1="-70" x2="-50" y2="50" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8,4"/>
    <line x1="-20" y1="-50" x2="-20" y2="60" stroke="#4facfe" stroke-width="2" stroke-dasharray="12,6"/>
    <line x1="10" y1="-65" x2="10" y2="35" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6,3"/>
    <line x1="40" y1="-40" x2="40" y2="65" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10,5"/>

    <circle cx="-50" cy="-30" r="5" fill="#00f2fe"/>
    <circle cx="10" cy="10" r="4" fill="#ffffff"/>
    <circle cx="40" cy="-10" r="4" fill="#00f2fe"/>

    <text x="0" y="20" text-anchor="middle" font-family="'Orbitron', monospace" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="3">
      THERMO::SHIFT
    </text>
    <text x="0" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#00f2fe" letter-spacing="1">
      HEAT REACTIVE 350ML
    </text>
  </g>
</svg>

