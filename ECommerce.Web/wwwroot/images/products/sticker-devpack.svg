<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#24153b" />
      <stop offset="100%" stop-color="#08050e" />
    </radialGradient>
    <linearGradient id="holoRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- Holographic Die-Cut Hexagon Sticker Sheet -->
  <polygon points="300,120 460,210 460,390 300,480 140,390 140,210" fill="#120c1d" stroke="url(#holoRainbow)" stroke-width="4" filter="url(#glow)"/>
  <polygon points="300,140 440,220 440,380 300,460 160,380 160,220" fill="none" stroke="url(#holoRainbow)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <!-- Sticker Content Graphic -->
  <g transform="translate(300, 290)">
    <circle cx="0" cy="-20" r="45" fill="none" stroke="url(#holoRainbow)" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="-12" font-family="'Courier New', monospace" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">&lt;DEV&gt;</text>
    <text x="0" y="45" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="url(#holoRainbow)" text-anchor="middle" letter-spacing="4">HOLO PACK x10</text>
    <text x="0" y="70" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="2">UV &amp; WATERPROOF VINYL</text>
  </g>
</svg>
