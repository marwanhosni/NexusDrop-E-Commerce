<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="100%" stop-color="#070912" />
    </radialGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="490" rx="160" ry="20" fill="none" stroke="url(#neonPurple)" stroke-width="2" filter="url(#glow)"/>
  <!-- Beanie Crown Dome -->
  <path d="M 190,370 C 180,180 420,180 410,370 Z" fill="#121521" stroke="#25293d" stroke-width="3"/>
  <!-- Folded Cuff -->
  <rect x="175" y="340" width="250" height="70" rx="12" fill="#1a1e2f" stroke="url(#neonPurple)" stroke-width="2" filter="url(#glow)"/>
  <!-- Binary Matrix Stitch on Cuff -->
  <g font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#06b6d4" text-anchor="middle">
    <text x="300" y="380" letter-spacing="4">&lt;01001101 01001000&gt;</text>
  </g>
  <text x="300" y="450" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="url(#neonPurple)" text-anchor="middle" letter-spacing="4">BINARY KNIT BEANIE</text>
</svg>
