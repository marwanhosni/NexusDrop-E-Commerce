<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="100%" stop-color="#09090d" />
    </radialGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="180" ry="24" fill="none" stroke="url(#neonEmerald)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- T-Shirt Body -->
  <path d="M 230,120 Q 300,165 370,120 L 460,180 L 415,260 L 375,235 L 375,470 L 225,470 L 225,235 L 185,260 L 140,180 Z" 
        fill="#0d0e13" stroke="#1f232f" stroke-width="3" />
  <path d="M 230,120 Q 300,165 370,120 Q 300,140 230,120 Z" fill="#14161f" stroke="#10b981" stroke-width="1.5"/>

  <!-- Chest Graphic: Minimalist Hex Kernel Code -->
  <g transform="translate(300, 275)" filter="url(#glow)">
    <rect x="-85" y="-60" width="170" height="110" rx="6" fill="#141822" stroke="url(#neonEmerald)" stroke-width="1.5"/>
    <rect x="-85" y="-60" width="170" height="20" rx="6" fill="#1e2433"/>
    <circle cx="-70" cy="-50" r="3" fill="#ef4444"/>
    <circle cx="-60" cy="-50" r="3" fill="#f59e0b"/>
    <circle cx="-50" cy="-50" r="3" fill="#10b981"/>
    
    <text x="-70" y="-22" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#10b981">
      &gt; 0xDEADBEEF
    </text>
    <text x="-70" y="-8" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#06b6d4">
      &gt; OVERFLOW: ROOT
    </text>
    <text x="-70" y="6" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#a855f7">
      &gt; ZERO_DAY.EXE
    </text>
    <text x="-70" y="24" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#38bdf8">
      STATUS: GRANTED_
    </text>

    <text x="0" y="75" text-anchor="middle" font-family="'Orbitron', monospace" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="3">
      ZERO::DAY EXPLOIT
    </text>
  </g>
</svg>

