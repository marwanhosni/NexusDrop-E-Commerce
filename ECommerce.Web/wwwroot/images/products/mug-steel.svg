<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1830" />
      <stop offset="100%" stop-color="#08070d" />
    </radialGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="35%" stop-color="#3d445c" />
      <stop offset="50%" stop-color="#555f80" />
      <stop offset="70%" stop-color="#2a3044" />
      <stop offset="100%" stop-color="#161924" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="500" rx="150" ry="20" fill="none" stroke="url(#purpleGlow)" stroke-width="2" filter="url(#glow)"/>

  <!-- Tumbler Body -->
  <path d="M 215,160 L 235,465 Q 300,480 365,465 L 385,160 Z" fill="url(#steelGrad)" stroke="#2f374e" stroke-width="2"/>

  <!-- Glowing Accent Bands -->
  <path d="M 216,190 L 384,190" stroke="url(#purpleGlow)" stroke-width="4" filter="url(#glow)"/>
  <path d="M 226,380 L 374,380" stroke="#06b6d4" stroke-width="2" opacity="0.8"/>

  <!-- Lid -->
  <rect x="210" y="140" width="180" height="24" rx="6" fill="#12141c" stroke="#3b4259" stroke-width="2"/>
  <rect x="235" y="125" width="130" height="16" rx="4" fill="#1f2333" stroke="url(#purpleGlow)" stroke-width="1.5"/>

  <!-- Tumbler Branding Graphic -->
  <g transform="translate(300, 290)">
    <!-- Reactor Core Icon -->
    <circle cx="0" cy="0" r="34" fill="#12141c" stroke="url(#purpleGlow)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="0" cy="0" r="8" fill="url(#purpleGlow)"/>

    <text x="0" y="55" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="3">
      OVERCLOCK::450
    </text>
    <text x="0" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" fill="#a855f7" letter-spacing="1">
      STEEL VACUUM 12H COLD/HOT
    </text>
  </g>
</svg>

