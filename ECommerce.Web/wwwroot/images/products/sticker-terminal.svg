<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1d13" />
      <stop offset="100%" stop-color="#040906" />
    </radialGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- Terminal Window Sticker Shape -->
  <rect x="120" y="150" width="360" height="300" rx="16" fill="#0b140f" stroke="url(#neonGreen)" stroke-width="3" filter="url(#glow)"/>
  <!-- Window Header -->
  <rect x="120" y="150" width="360" height="40" rx="16" fill="#14241b"/>
  <circle cx="145" cy="170" r="6" fill="#ef4444"/>
  <circle cx="165" cy="170" r="6" fill="#f59e0b"/>
  <circle cx="185" cy="170" r="6" fill="#10b981"/>
  <text x="300" y="175" font-family="'Courier New', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">bash - nexusdrop</text>
  <!-- Terminal Content -->
  <g font-family="'Courier New', monospace" font-size="15" fill="#10b981" font-weight="bold" filter="url(#glow)">
    <text x="150" y="230">$ dotnet run</text>
    <text x="150" y="265">&gt; Building NexusDrop...</text>
    <text x="150" y="300">&gt; Status: 200 OK</text>
    <text x="150" y="335">&gt; Ready on :5132 🚀</text>
    <rect x="150" y="360" width="12" height="18" fill="#10b981"/>
  </g>
  <text x="300" y="490" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="url(#neonGreen)" text-anchor="middle" letter-spacing="4">TERMINAL VINYL TAG</text>
</svg>
