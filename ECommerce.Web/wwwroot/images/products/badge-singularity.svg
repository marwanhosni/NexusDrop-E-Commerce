<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1030" />
      <stop offset="100%" stop-color="#09050d" />
    </radialGradient>
    <linearGradient id="singularityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="160" ry="20" fill="none" stroke="url(#singularityGrad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Badge Group -->
  <g transform="translate(300, 290)">
    <!-- Round Bezel -->
    <circle cx="0" cy="0" r="150" fill="#15121c" stroke="#2b233a" stroke-width="12"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#singularityGrad)" stroke-width="4" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="135" fill="#0d0a13"/>

    <!-- Prismatic Singularity Rings -->
    <g filter="url(#glow)">
      <ellipse cx="0" cy="0" rx="100" ry="35" fill="none" stroke="url(#singularityGrad)" stroke-width="3" transform="rotate(-30)"/>
      <ellipse cx="0" cy="0" rx="100" ry="35" fill="none" stroke="url(#singularityGrad)" stroke-width="3" transform="rotate(30)"/>
      <ellipse cx="0" cy="0" rx="100" ry="35" fill="none" stroke="#00f2fe" stroke-width="2"/>

      <!-- Event Horizon Core -->
      <circle cx="0" cy="0" r="26" fill="#000000" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="16" fill="url(#singularityGrad)"/>
    </g>

    <!-- Magnetic Clasp Notch Indicator -->
    <circle cx="0" cy="-115" r="4" fill="#a855f7"/>
    <circle cx="0" cy="115" r="4" fill="#a855f7"/>

    <text x="0" y="85" text-anchor="middle" font-family="'Orbitron', monospace" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="3">
      QUANTUM::SINGULARITY
    </text>
    <text x="0" y="100" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" fill="#ec4899" letter-spacing="2">
      SUPERCONDUCTING MAGNET PIN
    </text>
  </g>
</svg>

