<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#122a22" />
      <stop offset="100%" stop-color="#050d0a" />
    </radialGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="160" ry="20" fill="none" stroke="url(#neuralGrad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Badge Patch Group (Rubberized PVC Aesthetic) -->
  <g transform="translate(300, 290)">
    <!-- Pentagon Outer Patch -->
    <polygon points="0,-160 145,-55 90,135 -90,135 -145,-55" fill="#111915" stroke="#22332a" stroke-width="12"/>
    <polygon points="0,-160 145,-55 90,135 -90,135 -145,-55" fill="none" stroke="url(#neuralGrad)" stroke-width="4" filter="url(#glow)"/>

    <!-- Neural Network Graph -->
    <g filter="url(#glow)">
      <!-- Connections -->
      <line x1="0" y1="-70" x2="-60" y2="-20" stroke="#10b981" stroke-width="3"/>
      <line x1="0" y1="-70" x2="60" y2="-20" stroke="#10b981" stroke-width="3"/>
      <line x1="-60" y1="-20" x2="-40" y2="45" stroke="#06b6d4" stroke-width="3"/>
      <line x1="60" y1="-20" x2="40" y2="45" stroke="#06b6d4" stroke-width="3"/>
      <line x1="-40" y1="45" x2="0" y2="10" stroke="#10b981" stroke-width="3"/>
      <line x1="40" y1="45" x2="0" y2="10" stroke="#10b981" stroke-width="3"/>
      <line x1="0" y1="-70" x2="0" y2="10" stroke="#ffffff" stroke-width="3"/>

      <!-- Nodes -->
      <circle cx="0" cy="-70" r="14" fill="#ffffff" stroke="#10b981" stroke-width="4"/>
      <circle cx="-60" cy="-20" r="10" fill="#10b981"/>
      <circle cx="60" cy="-20" r="10" fill="#10b981"/>
      <circle cx="0" cy="10" r="12" fill="#06b6d4" stroke="#ffffff" stroke-width="3"/>
      <circle cx="-40" cy="45" r="9" fill="#3b82f6"/>
      <circle cx="40" cy="45" r="9" fill="#3b82f6"/>
    </g>

    <text x="0" y="90" text-anchor="middle" font-family="'Orbitron', monospace" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="3">
      A.I. NEURAL SYNDICATE
    </text>
    <text x="0" y="105" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" fill="#10b981" letter-spacing="2">
      GLOW IN DARK PVC PATCH
    </text>
  </g>
</svg>

