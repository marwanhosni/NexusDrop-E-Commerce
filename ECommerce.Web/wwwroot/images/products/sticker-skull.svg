<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1228" />
      <stop offset="100%" stop-color="#09050d" />
    </radialGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- Circular Vinyl Decal Outline -->
  <circle cx="300" cy="300" r="180" fill="#140a17" stroke="url(#neonPink)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="300" cy="300" r="165" fill="none" stroke="#2c1630" stroke-width="2"/>
  <!-- Cyber Samurai Oni Mask / Skull Graphic -->
  <g transform="translate(300, 280)" filter="url(#glow)">
    <polygon points="0,-70 45,-25 35,35 0,65 -35,35 -45,-25" fill="none" stroke="url(#neonPink)" stroke-width="3"/>
    <!-- Eye slits -->
    <polygon points="-25,-5 -10,-10 -15,5" fill="#ec4899"/>
    <polygon points="25,-5 10,-10 15,5" fill="#ec4899"/>
    <!-- Horns -->
    <path d="M -35,-25 Q -60,-60 -50,-80 Q -30,-60 -25,-30" fill="url(#neonPink)"/>
    <path d="M 35,-25 Q 60,-60 50,-80 Q 30,-60 25,-30" fill="url(#neonPink)"/>
  </g>
  <text x="300" y="420" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">CYBER SAMURAI DECAL</text>
</svg>
