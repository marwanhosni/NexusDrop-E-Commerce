<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="100%" stop-color="#070913" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="520" rx="190" ry="24" fill="none" stroke="url(#neonCyan)" stroke-width="2" filter="url(#glow)"/>
  <!-- Pullover Body -->
  <path d="M 210,130 Q 300,175 390,130 L 480,200 L 430,320 L 385,280 L 385,480 L 215,480 L 215,280 L 170,320 L 120,200 Z" fill="#0b0e17" stroke="#1f2538" stroke-width="3" />
  <!-- Minimalist Geometric Triangle -->
  <g transform="translate(300, 290)" filter="url(#glow)">
    <polygon points="0,-60 52,30 -52,30" fill="none" stroke="url(#neonCyan)" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="70" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#06b6d4" text-anchor="middle" letter-spacing="5">STEALTH PROTOCOL</text>
  </g>
</svg>
