<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#191333" />
      <stop offset="100%" stop-color="#07060f" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="480" rx="160" ry="20" fill="none" stroke="url(#neonCyan)" stroke-width="2" filter="url(#glow)"/>
  <!-- Cap Crown -->
  <path d="M 180,340 C 180,180 420,180 420,340 Z" fill="#11131c" stroke="#252a3d" stroke-width="3"/>
  <!-- Snapback Visor/Brim Flat -->
  <path d="M 160,340 Q 300,320 440,340 L 490,380 Q 300,360 110,380 Z" fill="#181b28" stroke="url(#neonCyan)" stroke-width="2" filter="url(#glow)"/>
  <!-- Front Embroidered Logo -->
  <g transform="translate(300, 260)" filter="url(#glow)">
    <polygon points="0,-40 35,-15 25,25 -25,25 -35,-15" fill="none" stroke="url(#neonCyan)" stroke-width="3"/>
    <text x="0" y="8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">MH</text>
  </g>
  <text x="300" y="440" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="url(#neonCyan)" text-anchor="middle" letter-spacing="4">QUANTUM SNAPBACK</text>
</svg>
