<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#28112b" />
      <stop offset="100%" stop-color="#09050d" />
    </radialGradient>
    <linearGradient id="synthSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="gridLines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <g transform="translate(60, 180)">
    <polygon points="40,0 440,0 480,240 0,240" fill="#120b18" stroke="url(#gridLines)" stroke-width="3" filter="url(#glow)"/>
    <!-- Synthwave Sun -->
    <circle cx="240" cy="90" r="50" fill="url(#synthSun)" filter="url(#glow)"/>
    <!-- Sun Cutout Lines -->
    <line x1="180" y1="80" x2="300" y2="80" stroke="#120b18" stroke-width="3"/>
    <line x1="190" y1="95" x2="290" y2="95" stroke="#120b18" stroke-width="4"/>
    <line x1="205" y1="110" x2="275" y2="110" stroke="#120b18" stroke-width="5"/>
    <!-- Horizon Grid Lines -->
    <g stroke="url(#gridLines)" stroke-width="1.5" opacity="0.7">
      <line x1="240" y1="110" x2="40" y2="240"/>
      <line x1="240" y1="110" x2="140" y2="240"/>
      <line x1="240" y1="110" x2="240" y2="240"/>
      <line x1="240" y1="110" x2="340" y2="240"/>
      <line x1="240" y1="110" x2="440" y2="240"/>
    </g>
    <text x="240" y="220" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">SYNTH HORIZON 1984</text>
  </g>
</svg>
