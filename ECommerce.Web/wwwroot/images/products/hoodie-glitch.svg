<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#16122b" />
      <stop offset="100%" stop-color="#07080f" />
    </radialGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="520" rx="190" ry="24" fill="none" stroke="url(#neonPurple)" stroke-width="2" filter="url(#glow)"/>
  <!-- Hoodie Body -->
  <path d="M 210,130 Q 300,180 390,130 L 480,200 L 430,320 L 385,280 L 385,480 L 215,480 L 215,280 L 170,320 L 120,200 Z" fill="#0f111a" stroke="#2a2e45" stroke-width="3" />
  <!-- Hood -->
  <path d="M 220,130 Q 300,60 380,130 Q 340,190 300,190 Q 260,190 220,130 Z" fill="#181b29" stroke="url(#neonPurple)" stroke-width="2" filter="url(#glow)"/>
  <!-- Kangaroo Pocket -->
  <path d="M 240,360 L 360,360 L 375,440 L 225,440 Z" fill="#131622" stroke="#25293d" stroke-width="2" />
  <!-- Glitch Chest Graphic -->
  <g transform="translate(300, 270)" filter="url(#glow)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="28" font-weight="900" fill="url(#neonCyan)" text-anchor="middle" letter-spacing="4">&lt;NEXUS_DROP&gt;</text>
    <line x1="-120" y1="15" x2="120" y2="15" stroke="url(#neonPurple)" stroke-width="3"/>
    <text x="0" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="6">GLITCH OVERSIZED // 2026</text>
  </g>
</svg>
