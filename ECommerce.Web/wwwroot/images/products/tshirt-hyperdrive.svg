<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a122e" />
      <stop offset="100%" stop-color="#09080e" />
    </radialGradient>
    <linearGradient id="synthSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="60%" stop-color="#ff7700" />
      <stop offset="100%" stop-color="#ffee00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="180" ry="24" fill="none" stroke="#ff007f" stroke-width="2" filter="url(#glow)"/>

  <!-- T-Shirt Body -->
  <path d="M 230,120 Q 300,165 370,120 L 460,180 L 415,260 L 375,235 L 375,470 L 225,470 L 225,235 L 185,260 L 140,180 Z" 
        fill="#13101c" stroke="#251c33" stroke-width="3" />
  <path d="M 230,120 Q 300,165 370,120 Q 300,140 230,120 Z" fill="#1c1629" stroke="#ff007f" stroke-width="1.5"/>

  <!-- Chest Graphic: Synthwave Sunset Grid -->
  <g transform="translate(300, 275)" filter="url(#glow)">
    <!-- Synth Sun with Horizontal Blind Slices -->
    <circle cx="0" cy="-15" r="45" fill="url(#synthSun)"/>
    <rect x="-50" y="-12" width="100" height="3" fill="#13101c"/>
    <rect x="-50" y="-4" width="100" height="4" fill="#13101c"/>
    <rect x="-50" y="6" width="100" height="5" fill="#13101c"/>
    <rect x="-50" y="18" width="100" height="6" fill="#13101c"/>

    <!-- Perspective Grid Lines -->
    <line x1="-80" y1="24" x2="80" y2="24" stroke="#00f2fe" stroke-width="2"/>
    <line x1="-90" y1="36" x2="90" y2="36" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="-100" y1="50" x2="100" y2="50" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="0" y1="24" x2="0" y2="60" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="-30" y1="24" x2="-60" y2="60" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="30" y1="24" x2="60" y2="60" stroke="#00f2fe" stroke-width="1.5"/>

    <text x="0" y="80" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="4">
      HYPER::DRIVE '88
    </text>
  </g>
</svg>

