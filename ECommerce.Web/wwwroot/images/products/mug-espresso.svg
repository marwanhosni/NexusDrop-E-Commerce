<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18152e" />
      <stop offset="100%" stop-color="#08070d" />
    </radialGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="290" cy="480" rx="130" ry="18" fill="none" stroke="url(#neonPink)" stroke-width="2" filter="url(#glow)"/>

  <!-- Handle -->
  <path d="M 370,270 C 440,270 440,380 370,380" fill="none" stroke="#1f1a30" stroke-width="18" stroke-linecap="round"/>
  <path d="M 370,270 C 440,270 440,380 370,380" fill="none" stroke="url(#neonPink)" stroke-width="2" filter="url(#glow)"/>

  <!-- Saucer -->
  <ellipse cx="290" cy="445" rx="140" ry="22" fill="#141120" stroke="#2c2445" stroke-width="2"/>
  <ellipse cx="290" cy="445" rx="110" ry="14" fill="#0d0a14" stroke="url(#neonPink)" stroke-width="1.5"/>

  <!-- Cup -->
  <path d="M 210,250 L 225,430 Q 290,445 355,430 L 370,250 Z" fill="#151222" stroke="#2f2549" stroke-width="2.5"/>
  <ellipse cx="290" cy="250" rx="80" ry="20" fill="#201a33" stroke="url(#neonPink)" stroke-width="2"/>
  <ellipse cx="290" cy="250" rx="70" ry="15" fill="#0f0c18"/>

  <!-- Graphic -->
  <g transform="translate(290, 345)" filter="url(#glow)">
    <polygon points="0,-25 22,12 -22,12" fill="none" stroke="url(#neonPink)" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#ec4899"/>
    <text x="0" y="32" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" letter-spacing="2">
      NEO::ESPRESSO 120ML
    </text>
  </g>
</svg>

