<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#091c14" />
      <stop offset="100%" stop-color="#050907" />
    </radialGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="520" rx="190" ry="24" fill="none" stroke="url(#neonGreen)" stroke-width="2" filter="url(#glow)"/>
  <!-- Jacket Body -->
  <path d="M 210,130 Q 300,175 390,130 L 485,200 L 435,325 L 385,285 L 385,480 L 215,480 L 215,285 L 165,325 L 115,200 Z" fill="#0d1410" stroke="#1d2e24" stroke-width="3" />
  <!-- Center Zipper -->
  <line x1="300" y1="150" x2="300" y2="480" stroke="url(#neonGreen)" stroke-width="3" filter="url(#glow)"/>
  <!-- Matrix Circuit Patterns -->
  <g stroke="url(#neonGreen)" stroke-width="1.5" opacity="0.8" filter="url(#glow)">
    <polyline points="230,220 250,250 250,320 270,340"/>
    <circle cx="270" cy="340" r="3" fill="#10b981"/>
    <polyline points="370,220 350,250 350,320 330,340"/>
    <circle cx="330" cy="340" r="3" fill="#10b981"/>
  </g>
  <text x="300" y="420" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle" letter-spacing="4">MATRIX CORE // ZIP-UP</text>
</svg>
