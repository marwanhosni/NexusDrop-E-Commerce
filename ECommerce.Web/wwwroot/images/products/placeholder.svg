<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="100%" stop-color="#080a11" />
    </radialGradient>
    <linearGradient id="cyberLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="500" rx="160" ry="20" fill="none" stroke="url(#cyberLine)" stroke-width="1.5" filter="url(#glow)"/>

  <g transform="translate(300, 270)" filter="url(#glow)">
    <polygon points="0,-80 70,-40 70,40 0,80 -70,40 -70,-40" fill="#121624" stroke="url(#cyberLine)" stroke-width="3"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="20" font-weight="900" fill="#ffffff">MH</text>
    
    <text x="0" y="120" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="3">
      MARWAN HOSNY STORE
    </text>
    <text x="0" y="140" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">
      OFFICIAL MERCHANDISE
    </text>
  </g>
</svg>
