<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="580" height="120">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Cyber Hex Icon with MH Monogram -->
  <polygon points="60,20 95,40 95,80 60,100 25,80 25,40" fill="none" stroke="url(#neonGrad)" stroke-width="4" filter="url(#glow)"/>
  <polygon points="60,32 84,46 84,74 60,88 36,74 36,46" fill="#121526" stroke="#06b6d4" stroke-width="2"/>
  <text x="60" y="67" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="16" font-weight="900" fill="#ffffff">MH</text>
  
  <!-- Brand Text -->
  <text x="120" y="66" font-family="'Orbitron', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="#ffffff">
    MARWAN<tspan fill="#06b6d4">//</tspan><tspan fill="#a855f7">HOSNY</tspan>
  </text>
  <text x="122" y="92" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="5" fill="#94a3b8">
    OFFICIAL MERCHANDISE STORE
  </text>
</svg>
